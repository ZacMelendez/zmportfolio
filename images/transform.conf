# Shared by the /img/ locations; expects $op, $op_args and $src to be set.
include /etc/nginx/snippets/security-headers.conf;

# A clean 404 rather than transformimgs' 500 when the original is missing.
if (!-f $document_root/originals/$src) {
    return 404;
}

set $img_accept "$accept_avif$accept_jxl$accept_webp";

proxy_pass http://transformimgs/img/http://images:8080/originals/$src/$op$op_args;
proxy_set_header Accept $img_accept;
proxy_set_header Save-Data "";
proxy_set_header X-Forwarded-Proto "";

proxy_cache images;
proxy_cache_key "$op$op_args|$src|$img_accept";
# The key already covers what Vary: Accept means; nginx's own Vary handling
# would split the cache on every browser's raw Accept string instead.
proxy_ignore_headers Vary;
proxy_cache_valid 200 60d;
proxy_cache_valid any 1m;
# One encode per image and size, however many requests arrive at once.
proxy_cache_lock on;
proxy_cache_lock_timeout 30s;
proxy_cache_use_stale error timeout updating;
proxy_read_timeout 30s;

add_header X-Cache $upstream_cache_status always;
