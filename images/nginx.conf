# Public URLs (all on this container's port 8080):
#   /originals/<path>                     the full-size file, as uploaded
#   /img/<path>/optimise                  re-encoded at the original size
#   /img/<path>/resize?size=<width>       re-encoded at one of the widths below
#
# transformimgs fetches any URL it is given, so it is never exposed directly:
# this server builds its source URL, which can only point at /originals/ here.
# It also has no cache of its own, so results are cached below.

proxy_cache_path /var/cache/images levels=1:2 keys_zone=images:10m
                 max_size=2g inactive=60d use_temp_path=off;

upstream transformimgs {
    server transformimgs:8080;
}

# transformimgs picks AVIF, JPEG XL, WebP or the source format from the Accept
# header. Reduce Accept to the formats it looks at, so every browser that gets
# the same output shares one cache entry.
map $http_accept $accept_avif { default ""; "~image/avif" "image/avif,"; }
map $http_accept $accept_jxl  { default ""; "~image/jxl"  "image/jxl,"; }
map $http_accept $accept_webp { default ""; "~image/webp" "image/webp,"; }

# Only these widths, so nobody can make the NAS encode endless sizes. Keep in
# step with IMAGE_WIDTHS in src/utils/image.ts.
map $arg_size $resize_width {
    default "";
    "~^(320|480|640|800|960|1280|1600|1920|2560)$" $arg_size;
}

server {
    listen 8080;
    server_name _;
    root /srv/images;

    server_tokens off;
    default_type text/plain;
    absolute_redirect off;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Full-size files. Uploads should get a new name when they change, so
    # they can be cached for a long time.
    location /originals/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=2592000" always;
        try_files $uri =404;
    }

    # <path> segments may not start with a dot (no "..", no hidden files).
    location ~ "^/img/(?<src>(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?i:jpe?g|png|webp|avif|gif|tiff?))/optimise$" {
        set $op optimise;
        set $op_args "";
        include /etc/nginx/snippets/transform.conf;
    }

    location ~ "^/img/(?<src>(?:[A-Za-z0-9_-][A-Za-z0-9._-]*/)*[A-Za-z0-9_-][A-Za-z0-9._-]*\.(?i:jpe?g|png|webp|avif|gif|tiff?))/resize$" {
        if ($resize_width = "") {
            return 400 "size must be one of 320, 480, 640, 800, 960, 1280, 1600, 1920, 2560\n";
        }
        set $op resize;
        set $op_args "?size=$resize_width";
        include /etc/nginx/snippets/transform.conf;
    }

    location / {
        return 404;
    }
}
